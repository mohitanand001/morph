name: tests
on:
  push:
  pull_request:
# Read-only: tests never need to write to the repository, so a compromised step can't either.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node test/run-all.js

  # Morph Lab: a real GNOME Shell (headless), Morph's real helper and program, stand-in apps on the real clipboard.
  lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            gnome-shell gjs dbus dbus-x11 mutter gir1.2-gtk-4.0 librsvg2-common fonts-cantarell adwaita-icon-theme
      - run: sudo -E env "PATH=$PATH" node test/lab/run.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: morph-lab-report
          path: test-results/lab
